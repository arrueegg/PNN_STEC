# Configuration for BayesianResNetSTEC: Deterministic ResNet backbone + Bayesian head
# Combines the expressiveness of ResNet with principled Bayesian uncertainty estimation

# General configuration
project_name: "PNN_STEC"
output_dir: "experiments/"
year: 2024
doy: 182
mode: pretrain # pretrain, finetune
random_seed: 42
debug: False  
debug_single_batch: False  
cluster: False

# Wandb configuration
wandb:
  offline: True  # Set to true to run wandb in offline mode (saves locally, sync manually later)

target: "stec" # stec or vtec

data:
  GNSS_data_path: "/home/space/data/iono/STEC_DB_CASDCB"
  use_agg_h5: True
  scratch_dir: "/scratch2/arrueegg/WP4/PNN_STEC/data/"
  SWI_data_path: "/home/space/data/iono/SWI/"
  move_to_scratch: True # Whether to move data to scratch for faster access
  every_x_doy: 1 # Use every x day of year (1 = all, 2 = every second day, etc.)
  use_SWI: True # Whether to use Space Weather Indices as input data
  SH_degree: 0
  min_elevation: 5.0
  max_elevation: 90.0
  shuffle: True
  train_subset_size: 500_000  # Number of samples to use per epoch
  val_size: 1_000_000  # Number of validation samples to use ('full' for entire val set, or integer for specific count)
  test_size: 10_000_000  # Number of test samples to use ('full' for entire test set, or integer for specific count)

model:
  model_type: BayesianResNetSTEC # Deterministic ResNet backbone + Bayesian head
  hidden_dim: 512    # Number of neurons in hidden layers
  num_layers: 2      # Number of residual blocks
  prior_sigma: 0.05  # Standard deviation for the Gaussian prior in Bayesian head
  dropout_rate: 0.0  # Dropout rate for residual blocks
  
training:
  loss_function: "GaussianNLLLoss"  # Loss function for uncertainty estimation
  loss_weight: 1.0                  # Weight for the loss function
  
  # KL annealing for BNN training (gradually increase KL weight)
  kl_annealing:
    enabled: true                    # Enable KL annealing
    warmup_epochs: 5               # Number of epochs to warm up KL weight from 0 to full
    start_weight: 0.0               # Starting KL weight (0 = no KL initially)
    end_weight: 0.1                 # Final KL weight
  
  # Target weighting configuration for addressing underprediction of high values
  target_weighting:
    enabled: false                    # Enable weighted loss based on target values
    weight_function: "linear"      # Options: linear, quadratic, log
  
  optimizer: "Adam"             # SGD, Adam, AdamW
  weight_decay: 0.0             # Weight decay for regularization
  standardize_targets: False        # Disable target standardization to avoid negative loss
  log_target: False              # Disable log-space training
  log_space_point: "mean"        # For compatibility

pretrain:
  epochs: 150
  batchsize: 1024
  num_workers: 12 
  prefetch_factor: 4
  learning_rate: 0.01
  scheduler: ReduceLROnPlateau            # none, StepLR, CosineAnnealingLR
  scheduler_step_size: 150       # Step size for scheduler
  early_stopping: true          # Whether to use early stopping
  patience: 20                   # Patience for early stopping
  save_model_every_epoch: False # Whether to save the model every epoch

finetune:
  epochs: 100
  num_workers: 12
  learning_rate: 0.001
  scheduler: ReduceLROnPlateau             # none, StepLR, CosineAnnealingLR
  scheduler_step_size: 100       # Step size for scheduler
