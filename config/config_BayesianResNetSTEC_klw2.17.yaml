# R2.6 epistemic-calibration arm B: KL weight, lower bracket point (global target).
#
# See config_BayesianResNetSTEC_ps0.466.yaml's header for the shared background. This arm
# varies the OTHER lever: the annealed KL weight (training.loss_weight, mirrored into
# training.kl_annealing.end_weight - the two must agree, see stec/training/loss.py's
# docstring on why a mismatch trains a genuinely different model), leaving prior_sigma at
# the paper's 0.1.
#
# Derivation: BKLLoss uses reduction="mean" (stec/training/loss.py, src/utils/loss_function.py
# get_criterion), so the KL penalty is averaged over the output layer's 2050 parameters
# (2 x 1024 weights + 2 biases) rather than summed - kl_weight=0.1 therefore applies an
# effective per-weight pull of only ~0.1/2050 ~= 4.9e-5, tiny next to any plausible
# per-weight data-term stiffness. That is consistent with the severe measured collapse and
# predicts training is data-dominated, not prior-pull-dominated: solving the per-weight
# balance (data term ~ c*sigma^2, KL term ~ kl_weight*(-1/sigma + sigma/prior_sigma^2)) in
# that regime gives sigma_posterior ~ sqrt(kl_weight / 2c), i.e. posterior std - and, since
# this is a linear last layer, predictive epistemic std too - scales with sqrt(kl_weight),
# not sqrt(prior_sigma). To move epistemic std by the diagnostic's global factor 4.66x needs
# kl_weight larger by 4.66^2 ~= 21.7x: 0.1 * 21.7 ~= 2.17.
#
# This is the arm the data-dominated-regime argument favours (see arm A's header for the
# competing, prior_sigma-ceiling hypothesis); arm C (config_BayesianResNetSTEC_klw4.21.yaml)
# is the second bracket point, anchored to the paper's actual test year's steeper need
# (6.49x for 2024 specifically) rather than the global average.
#
# evaluation.store_variant is mandatory - see arm A's header for the trap this avoids.
#
# Run via: python cli.py train --config config/config_BayesianResNetSTEC_klw2.17.yaml
# Then:    python src/inference_testset.py --config_path experiments/<exp_name>/config.yaml
