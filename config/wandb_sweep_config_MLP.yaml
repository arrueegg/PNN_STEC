program: scripts/wandb_run_wrapper.py
method: bayes  # bayes, grid, random
metric:
  goal: minimize
  name: val_MAE
parameters:
  # Model architecture parameters
  model.model_type:
    values: ['MLP_NLL']
  
  model.hidden_dim:
    values: [256, 512, 1024]
  
  model.num_layers:
    values: [4]

  # Training hyperparameters
  pretrain.learning_rate:
    values: [0.0001, 0.0005, 0.001, 0.005]
  
  pretrain.batchsize:
    values: [512, 1024]

  # Training configuration
  training.loss_function:
    values: ['GaussianNLLLoss']
  
  #training.optimizer:
    #values: ['Adam', 'AdamW']
  
  #training.weight_decay:
    #distribution: uniform
    #min: 0.0
    #max: 0.01

  # Target weighting
  #training.target_weighting.enabled:
    #values: [true, false]
  
  #training.target_weighting.weight_function:
    #values: ['linear', 'quadratic']

  # Scheduler configuration
  #pretrain.scheduler:
    #values: ['StepLR', 'CosineAnnealingLR']
  
  #pretrain.scheduler_step_size:
    #values: [20, 50, 100]

  # Data configuration
  #data.train_subset_size:
    #values: [500_000]

# Count limits
run_cap: 100  # Maximum number of runs in this sweep