program: src/main.py
method: bayes  # Bayesian optimization for efficient search
metric:
  goal: minimize
  name: val_MAE
parameters:
  # Model architecture parameters
  model.model_type:
    values: ['AttentionMLP_BNN_NLL']

  model.hidden_dim:
    values: [256, 512]  # Focus on mid-range

  model.num_layers:
    values: [3, 4]  # Sweet spot for attention

  model.num_heads:
    values: [4, 8]  # Standard multi-head configs

  model.dropout_rate:
    values: [0.0, 0.1]  # Light regularization

  model.prior_sigma:
    values: [0.01, 0.05]  # Most impactful Bayesian param

  data.SH_degree:
    values: [0, 5]

  # Training hyperparameters
  pretrain.learning_rate:
    values: [0.0005, 0.001]  # Attention typically needs higher LR

  pretrain.batchsize:
    values: [1024]  # Fix at optimal

  training.loss_weight:
    values: [0.01, 0.05]  # Lower KL weight for small Bayesian component

  # KL annealing
  kl_annealing.enabled:
    values: [true]
  
  kl_annealing.warmup_epochs:
    values: [10]  # Fix at standard value
  
  kl_annealing.end_weight:
    values: [0.01, 0.05]

  # Training configuration
  training.loss_function:
    values: ['GaussianNLLLoss']

# Count limits
run_cap: 40  # Maximum number of runs in this sweep
