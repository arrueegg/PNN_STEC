# Baseline configuration for deterministic STEC prediction
# This config serves as a performance baseline without uncertainty quantification

# General configuration
project_name: "PNN_STEC"
output_dir: "experiments/"
year: 2023
doy: 1
mode: pretrain # pretrain, finetune
random_seed: 42
debug: False  
debug_single_batch: False  
cluster: False

target: "stec" # stec or vtec

data:
  GNSS_data_path: "/home/space/data/iono/STEC_DB_CASDCB"
  use_agg_h5: True
  scratch_dir: "/scratch2/arrueegg/WP4/PNN_STEC/data/"
  SWI_data_path: "/home/space/data/iono/SWI/"
  move_to_scratch: True # Whether to move data to scratch for faster access
  every_x_doy: 1 # Use every x day of year (1 = all, 2 = every second day, etc.)
  use_SWI: True # Whether to use Space Weather Indices as input data
  SH_degree: 0
  min_elevation: 5.0
  max_elevation: 90.0
  shuffle: True
  train_subset_size: 1_000_000  # Large training set for baseline performance
  val_size: 1_000_000  # Number of validation samples to use ('full' for entire val set, or integer for specific count)
  test_size: 10_000_000  # Number of test samples to use ('full' for entire test set, or integer for specific count)

model:
  model_type: MLP  # Deterministic MLP for baseline (no uncertainty)
  hidden_dim: 1024     # Large hidden dimension for good capacity
  num_layers: 6        # Deep network for baseline performance
  
training:
  loss_function: "MSELoss"  # Standard MSE loss for deterministic models
  
  # Target weighting configuration for addressing underprediction of high values
  target_weighting:
    enabled: true                   # Enable target-based loss weighting
    weight_function: "quadratic"    # Use quadratic weighting for baseline
    
  epochs: 30                       # Longer training for baseline performance
  batch_norm: false                # Use batch normalization

# Pretraining configuration
pretrain:
  learning_rate: 0.001              # Conservative learning rate
  batchsize: 1024                   # Good batch size for stability
  weight_decay: 0.0001              # Regularization
  optimizer: "AdamW"                # AdamW for better generalization
  scheduler: "ReduceLROnPlateau"    # ReduceLROnPlateau for adaptive learning rate
  scheduler_step_size: 10           # For StepLR scheduler
  scheduler_gamma: 0.5              # Factor for ReduceLROnPlateau
  scheduler_patience: 5             # Patience for ReduceLROnPlateau scheduler
  early_stopping_patience: 15      # More patience for baseline training

# Fine-tuning configuration
finetune:
  learning_rate: 0.0005
  batchsize: 512
  weight_decay: 0.0001
  optimizer: "AdamW"
  scheduler: "CosineAnnealingLR"  # Use implemented scheduler
  scheduler_step_size: 10           # For StepLR scheduler
  scheduler_gamma: 0.1              # For StepLR scheduler
  early_stopping_patience: 10
  
# Timing and performance tracking
enable_timing: false              # Enable detailed timing logs