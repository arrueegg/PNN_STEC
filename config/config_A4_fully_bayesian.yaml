# A4: fully-Bayesian ablation for reviewer comment R2.2.
#
# Reviewer 2 observed that the Bayesian component of the published model is
# limited to the output layer while the ResNet body stays deterministic, and
# that this may understate epistemic uncertainty. This config trains the
# fully-Bayesian variant (`ResNet_BNN_NLL`, every residual block Bayesian) with
# every other setting identical to the published pretrain run, so the only
# variable is where the weight posteriors live.
#
# Known confound to report alongside the result: BayesianResNetSTEC initialises
# its output bias to STEC_MEAN_TECU (src/model/model.py:262), whereas
# ResNet_BNN_NLL leaves the Bayesian output layer to its own initialisation. If
# the fully-Bayesian model converges to a worse mean, initialisation is a
# candidate explanation, not only Bayesian depth.
cluster: false
data:
  GNSS_data_path: /home/space/data/iono/STEC_DB_CASDCB
  SH_degree: 5
  SWI_data_path: /home/space/data/iono/SWI/
  every_x_doy: 1
  max_elevation: 90.0
  min_elevation: 5.0
  move_to_scratch: true
  scratch_dir: /scratch2/arrueegg/WP4/PNN_STEC/data/
  shuffle: true
  test_size: 10000000
  train_subset_size: 500000
  use_SWI: true
  use_agg_h5: true
  val_size: 1000000
debug: false
debug_single_batch: false
doy: '183'
evaluation:
  enable_scenarios: false
feature_control:
  AE-index,_nT: true
  Dst-index,_nT: true
  Kp_index: true
  R_Sunspot_No: true
  ap_index,_nT: true
  doy: true
  f107_index: true
  lat_ipp: true
  lat_sta: true
  local_time_hours: true
  lon_ipp: true
  lon_sta: true
  satazi: true
  satele: true
  sm_lat_ipp: true
  sm_lat_sta: true
  sm_lon_ipp: true
  sm_lon_sta: true
  sod: true
  year: true
finetune:
  batchsize: 512
  early_stopping: true
  epochs: 50
  freeze_body: false
  learning_rate: 0.0002
  num_workers: 12
  patience: 15
  save_model_every_epoch: false
  scheduler: ReduceLROnPlateau
  scheduler_step_size: 100
mode: pretrain
model:
  activation: relu
  dropout_rate: 0.0
  ensemble_size: 5
  geom_hidden: 32
  geom_layers: 2
  hidden_dim: 1024
  model_type: ResNet_BNN_NLL
  num_heads: 4
  num_layers: 4
  output_size: 1
  prior_sigma: 0.1
  vtec_hidden: 128
  vtec_layers: 4
pretrain:
  batchsize: 1024
  early_stopping: true
  epochs: 150
  learning_rate: 0.001
  num_workers: 12
  patience: 20
  prefetch_factor: 4
  save_model_every_epoch: false
  scheduler: ReduceLROnPlateau
  scheduler_step_size: 150
project_name: PNN_STEC
random_seed: 42
target: stec
training:
  crps_num_samples: 16
  kl_annealing:
    enabled: true
    end_weight: 0.1
    start_weight: 0.0
    warmup_epochs: 5
  log_space_point: mean
  log_target: false
  loss_function: GaussianNLLLoss
  loss_weight: 0.1
  optimizer: Adam
  standardize_targets: false
  target_weighting:
    enabled: false
    weight_function: linear
  weight_decay: 0.0
wandb:
  offline: false
year: '2024'
