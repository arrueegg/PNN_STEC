# Comprehensive sweep - extensive parameter space for thorough exploration
program: src/main.py
method: bayes
metric:
  goal: minimize
  name: val_loss

parameters:
  # Full model architecture space
  model.model_type:
    values: ['BNN_NLL', 'MLP_NLL']
  
  model.hidden_dim:
    values: [256, 512, 1024, 2048]
  
  model.num_layers:
    values: [2, 4, 8]

  # Extended training hyperparameters
  pretrain.learning_rate:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.1
  
  pretrain.batchsize:
    values: [256, 512, 1024, 2048]
  
  training.loss_weight:
    distribution: log_uniform_values
    min: 0.001
    max: 10.0

  training.optimizer:
    values: ['Adam', 'AdamW']

  # Comprehensive KL annealing
  training.kl_annealing.warmup_epochs:
    values: [5, 10, 20]
  
  training.kl_annealing.end_weight:
    distribution: log_uniform_values
    min: 0.001
    max: 10.0

  # Full target weighting exploration
  training.target_weighting.enabled:
    values: [true, false]
  
  training.target_weighting.weight_function:
    values: ['linear', 'quadratic']

  # Scheduler exploration
  pretrain.scheduler:
    values: ['none', 'StepLR', 'CosineAnnealingLR']
  
  pretrain.scheduler_step_size:
    values: [20, 50, 100, 200]

  # Data size exploration
  data.train_subset_size:
    values: [250_000, 500_000, 2_000_000]

# Conservative early termination for thorough exploration
early_terminate:
  type: hyperband
  min_iter: 20
  eta: 3

run_cap: 100  # Large number of runs for comprehensive search