program: src/main.py
method: bayes  # Bayesian optimization for efficient search
metric:
  goal: minimize
  name: val_MAE
parameters:
  # Model architecture parameters
  model.model_type:
    values: ['BayesianResNetSTEC']

  model.hidden_dim:
    values: [512, 1024]  # Focus on reasonable sizes

  model.num_layers:
    values: [4]  # Deeper is usually better for ResNet

  model.dropout_rate:
    values: [0.0, 0.1]

  training.weight_decay:
    values: [0.0]  # Light regularization

  model.prior_sigma:
    values: [0.05, 0.1, 0.2, 0.5, 1.0]  # Prior stddev for Bayesian layers

  data.SH_degree:
    values: [5]

  # Training hyperparameters
  pretrain.learning_rate:
    values: [0.0005, 0.001]  # Most stable range

  pretrain.batchsize:
    values: [1024] 

  training.loss_weight:
    values: [0.1, 1, 5]  # KL weight for Bayesian head

  # Training configuration
  training.loss_function:
    values: ['GaussianNLLLoss']

# Count limits
run_cap: 200  # Maximum number of runs in this sweep
