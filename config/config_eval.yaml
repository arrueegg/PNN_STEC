# Evaluation Configuration for GNSS-based STEC ML Model
# This file contains default settings for evaluation flows:
# Legacy: 1. GIM → slant comparison, 2. VLBI dTEC comparison, 3. Madrigal comparison  
# New: STEC space comparison (model STEC vs GIM→STEC)

# Evaluation mode
mode: "stec"  # "stec" for STEC space comparison, "legacy" for original flows

# STEC evaluation settings
stec_evaluation:
  dataset: "testset"  # testset, madrigal, grid, vgosdb
  
  # Input data paths
  gnss_path: "./data/testset.parquet"
  madrigal_path: "./data/madrigal/"
  vgosdb_path: "./data/vgosdb/"
  gim_path: "./data/gim/igs_2024/"
  model_path: "./models/best_model.pt"
  
  # Physical parameters
  shell_height_km: 450.0      # Shell height in km (standard F2 layer peak height)
  earth_radius_km: 6371.0     # Earth radius in km (WGS84 mean radius)
  
  # Analysis options
  group_key: "station"        # Grouping strategy: "station" or "station_sat"
  remove_bias: true           # Remove per-group bias before computing metrics

# Legacy evaluation settings (for --mode legacy)
legacy_evaluation:
  run_gim_slant: true     # GIM → slant evaluation
  run_vlbi_dtec: false    # VLBI dTEC evaluation
  run_madrigal: false     # Madrigal evaluation

# Output configuration
output:
  output_dir: "./eval_results"
  enable_plots: true      # Generate visualization plots
  save_csvs: true         # Save results as CSV files for further analysis