## Comparison: Small vs Large Models

### Small ResNet (for quick experiments)
```yaml
model:
  model_type: ResNet_NLL
  hidden_dim: 256
  num_layers: 3
  dropout_rate: 0.05

pretrain:
  epochs: 100
  batchsize: 256
  learning_rate: 0.001
```

### Large ResNet (for best performance)
```yaml
model:
  model_type: ResNet_NLL
  hidden_dim: 2048
  num_layers: 8
  dropout_rate: 0.15

pretrain:
  epochs: 200
  batchsize: 1024
  learning_rate: 0.0003
```

### Small Attention (for quick experiments)
```yaml
model:
  model_type: AttentionMLP_NLL
  hidden_dim: 512
  num_layers: 2
  num_heads: 4
  dropout_rate: 0.05

pretrain:
  epochs: 100
  batchsize: 256
  learning_rate: 0.001
```

### Large Attention (for best performance)
```yaml
model:
  model_type: AttentionMLP_NLL
  hidden_dim: 1024
  num_layers: 6
  num_heads: 8
  dropout_rate: 0.15

pretrain:
  epochs: 200
  batchsize: 1024
  learning_rate: 0.0003
```

## Hyperparameter Search Configuration

```yaml
# For WandB sweep with new models
search_space:
  model.model_type:
    values: [ResNet_NLL, AttentionMLP_NLL, BNN_NLL]
  
  model.hidden_dim:
    values: [512, 1024, 2048]
  
  model.num_layers:
    values: [4, 6, 8]
  
  model.num_heads:
    # Only used for AttentionMLP_* models
    values: [4, 8, 16]
  
  model.dropout_rate:
    values: [0.05, 0.1, 0.15]
  
  pretrain.learning_rate:
    log_uniform_values: [0.0001, 0.01]
  
  pretrain.batchsize:
    values: [256, 512, 1024]
```

## Running Experiments

### Using ResNet_NLL
```bash
# Copy config
cp config/config_baseline.yaml config/config_resnet.yaml

# Edit to use ResNet_NLL
sed -i 's/model_type: .*/model_type: ResNet_NLL/' config/config_resnet.yaml

# Run
python src/main.py --config config/config_resnet.yaml
```

### Using AttentionMLP_NLL
```bash
cp config/config_baseline.yaml config/config_attention.yaml
sed -i 's/model_type: .*/model_type: AttentionMLP_NLL/' config/config_attention.yaml
python src/main.py --config config/config_attention.yaml
```

## Expected Performance

Based on architecture properties:

| Model | Training Time | Inference Time | Accuracy | Uncertainty Calibration |
|-------|---|---|---|---|
| ResNet_NLL | 1x | 1x | ++ | Good |
| AttentionMLP_NLL | 2-3x | 2-3x | +++ | Excellent |
| BNN_NLL | 4-5x | 4-5x | +++ | Excellent |

*Relative to MLP_NLL baseline*

## Troubleshooting

### "num_heads must divide hidden_dim"
The code automatically adjusts, but for best performance:
- hidden_dim=1024, num_heads=4 ✓
- hidden_dim=1024, num_heads=8 ✓
- hidden_dim=512, num_heads=4 ✓
- hidden_dim=256, num_heads=4 ✓

### "Out of memory" with Attention models
- Reduce `hidden_dim` from 1024 to 512
- Reduce `num_layers` from 6 to 4
- Reduce `batchsize` from 1024 to 512

### "Training unstable" with ResNet
- Reduce `dropout_rate` to 0.05
- Try smaller `learning_rate`: 0.0001 instead of 0.0005
- Increase `num_layers` gradually (4 → 6 → 8)

### "Variance predictions too high/low"
Normal behavior - variance is a learned parameter. If concerned:
- Check loss is decreasing
- Verify variance >= 1e-3 (should see this automatically)
- Compare with MLP_NLL baseline
