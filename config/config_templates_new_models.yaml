# Configuration Templates for New Models

Copy-paste ready configurations for ResNet and Attention models.

## ResNet_NLL (Recommended Starting Point)

```yaml
# config/config_resnet_nll.yaml
project_name: "PNN_STEC"
output_dir: "experiments/"
year: 2024
doy: 182
mode: finetune
random_seed: 42
debug: False

data:
  GNSS_data_path: "/home/space/data/iono/STEC_DB_CASDCB"
  use_agg_h5: True
  scratch_dir: "/scratch2/arrueegg/WP4/PNN_STEC/data/"
  SWI_data_path: "/home/space/data/iono/SWI/"
  move_to_scratch: True
  every_x_doy: 1
  use_SWI: True
  SH_degree: 0
  min_elevation: 5.0
  max_elevation: 90.0
  shuffle: True
  train_subset_size: 1_000_000
  val_size: 1_000_000
  test_size: 10_000_000

model:
  model_type: ResNet_NLL
  hidden_dim: 1024
  num_layers: 6
  dropout_rate: 0.1

training:
  loss_function: "GaussianNLLLoss"
  loss_weight: 1.0
  
  kl_annealing:
    enabled: false
  
  target_weighting:
    enabled: true
    weight_function: "linear"
  
  optimizer: "Adam"
  weight_decay: 0.0
  standardize_targets: False
  log_target: False

pretrain:
  epochs: 150
  batchsize: 512
  num_workers: 12
  prefetch_factor: 4
  learning_rate: 0.0005
  scheduler: CosineAnnealingLR
  scheduler_step_size: 150
  early_stopping: true
  patience: 20

finetune:
  epochs: 100
  num_workers: 12
  learning_rate: 0.001
  scheduler: ReduceLROnPlateau
  scheduler_step_size: 100
```

## ResNet_MSE (Deterministic Baseline)

```yaml
model:
  model_type: ResNet_MSE
  hidden_dim: 1024
  num_layers: 6
  dropout_rate: 0.1

training:
  loss_function: "MSELoss"
  loss_weight: 1.0
  target_weighting:
    enabled: true
    weight_function: "quadratic"  # More aggressive for deterministic
```

## AttentionMLP_NLL (Advanced - Feature Interactions)

```yaml
model:
  model_type: AttentionMLP_NLL
  hidden_dim: 1024
  num_layers: 4
  num_heads: 8
  dropout_rate: 0.1

training:
  loss_function: "GaussianNLLLoss"
  loss_weight: 1.0
  optimizer: "Adam"
  weight_decay: 0.0001  # Slightly higher for attention
  
  target_weighting:
    enabled: true
    weight_function: "linear"

pretrain:
  epochs: 150
  batchsize: 512
  learning_rate: 0.0005
  scheduler: CosineAnnealingLR
  scheduler_step_size: 150
```

