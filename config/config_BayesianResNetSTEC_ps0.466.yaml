# R2.6 epistemic-calibration arm A: prior_sigma only.
#
# The paper model (this same config with prior_sigma: 0.1) is badly under-dispersed in its
# epistemic term (1-sigma coverage 9.4% against nominal 68.3%; see
# multiday_results/analyses/epistemic_scale_diagnostic/rebuilt/). The diagnostic found a
# post-hoc scale s*=4.66 on epistemic sigma restores nominal coverage without hurting the
# uncertainty-error Spearman correlation (0.5609 -> 0.5625). This arm asks whether that
# factor can come from training instead of a post-hoc multiplier, by widening the BayesLinear
# output layer's prior width directly: prior_sigma = 0.1 * 4.66 ~= 0.466.
#
# Derivation (docs/revision/, R2.6 write-up): for a mean-field Gaussian posterior against
# N(0, prior_sigma^2), the per-weight KL divergence's own stationary point (absent any data
# pressure) is exactly sigma_posterior = prior_sigma - so prior_sigma sets the *ceiling* the
# posterior is pulled toward. Whether raising that ceiling alone moves the trained posterior
# depends on whether training is currently pull-dominated or data-dominated; see arms B/C
# (config_BayesianResNetSTEC_klw2.17.yaml, _klw4.21.yaml) for the alternative lever (KL
# weight, which sets the strength of the pull rather than its target) and
# docs/revision/ for why the data-dominated regime is judged more likely a priori.
#
# Everything else is identical to the paper's own pretrain config (copied from
# experiments/Pretrain_STEC_BayesianResNetSTEC_h1024_..._ps0.1_kl5w0.1_lw1e-1_SWI/config.yaml)
# - same architecture, same data, same seed, same 150-epoch budget - so this is a minimal,
# single-variable change, not a fresh hyperparameter search.
#
# evaluation.store_variant is mandatory here: the trap is that a prior_sigma variant is
# still model_type: BayesianResNetSTEC + mode: pretrain, which without this override would
# resolve to the paper model's own "pretrained_stec" partition and silently overwrite its
# 544-day store (this exact failure happened once already for the fully-Bayesian arm; see
# docs/revision/ and the 9e0e269 commit). Verified empirically before queueing, not assumed.
#
# Run via: python cli.py train --config config/config_BayesianResNetSTEC_ps0.466.yaml
# Then:    python src/inference_testset.py --config_path experiments/<exp_name>/config.yaml
cluster: false
data:
  GNSS_data_path: /home/space/data/iono/STEC_DB_CASDCB
  SH_degree: 5
  SWI_data_path: /home/space/data/iono/SWI/
  every_x_doy: 1
  max_elevation: 90.0
  min_elevation: 5.0
  move_to_scratch: true
  scratch_dir: /scratch2/arrueegg/WP4/PNN_STEC/data/
  shuffle: true
  test_size: 10000000
  train_subset_size: 500000
  use_SWI: true
  use_agg_h5: true
  val_size: 1000000
debug: false
debug_single_batch: false
doy: '183'
evaluation:
  enable_scenarios: false
  store_variant: pretrained_stec_ps0.466
feature_control:
  AE-index,_nT: true
  Dst-index,_nT: true
  Kp_index: true
  R_Sunspot_No: true
  ap_index,_nT: true
  doy: true
  f107_index: true
  lat_ipp: true
  lat_sta: true
  local_time_hours: true
  lon_ipp: true
  lon_sta: true
  satazi: true
  satele: true
  sm_lat_ipp: true
  sm_lat_sta: true
  sm_lon_ipp: true
  sm_lon_sta: true
  sod: true
  year: true
finetune:
  batchsize: 512
  early_stopping: true
  epochs: 50
  freeze_body: false
  learning_rate: 0.0002
  num_workers: 12
  patience: 15
  save_model_every_epoch: false
  scheduler: ReduceLROnPlateau
  scheduler_step_size: 100
mode: pretrain
model:
  activation: relu
  dropout_rate: 0.0
  ensemble_size: 5
  geom_hidden: 32
  geom_layers: 2
  hidden_dim: 1024
  model_type: BayesianResNetSTEC
  num_heads: 4
  num_layers: 4
  output_size: 1
  prior_sigma: 0.466
  vtec_hidden: 128
  vtec_layers: 4
output_dir: experiments/Pretrain_STEC_BayesianResNetSTEC_h1024_l4_nh4_v128x4_g32x2_lr1e-3_bs1024_GNLL_Adam_ReduceLROnPlateau_sub500K_SH5_ps0.47_kl5w0.1_lw1e-1_SWI
pretrain:
  batchsize: 1024
  early_stopping: true
  epochs: 150
  learning_rate: 0.001
  num_workers: 12
  patience: 20
  prefetch_factor: 4
  save_model_every_epoch: false
  scheduler: ReduceLROnPlateau
  scheduler_step_size: 150
pretrain_folder: experiments/Pretrain_STEC_BayesianResNetSTEC_h1024_l4_nh4_v128x4_g32x2_lr1e-3_bs1024_GNLL_Adam_ReduceLROnPlateau_sub500K_SH5_ps0.47_kl5w0.1_lw1e-1_SWI
project_name: PNN_STEC
random_seed: 42
target: stec
training:
  crps_num_samples: 16
  kl_annealing:
    enabled: true
    end_weight: 0.1
    start_weight: 0.0
    warmup_epochs: 5
  log_space_point: mean
  log_target: false
  loss_function: GaussianNLLLoss
  loss_weight: 0.1
  optimizer: Adam
  standardize_targets: false
  target_weighting:
    enabled: false
    weight_function: linear
  weight_decay: 0.0
wandb:
  offline: false
year: '2024'
