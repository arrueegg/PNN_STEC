# Cluster configuration for baseline (deterministic MLP) training
# Combines cluster paths with baseline model settings

# General configuration
project_name: "PNN_STEC"
output_dir: "experiments/"
year: 2023
doy: 1
mode: pretrain # pretrain, finetune
random_seed: 42
debug: False  
debug_single_batch: False  
cluster: True

target: "stec" # stec or vtec

data:
  GNSS_data_path: /cluster/work/igp_psr/arrueegg/WP4/PNN_STEC/data/STEC_DB_CASDCB
  use_agg_h5: True
  scratch_dir: /cluster/work/igp_psr/arrueegg/WP4/PNN_STEC/data/
  SWI_data_path: /cluster/work/igp_psr/arrueegg/WP4/PNN_STEC/data/
  move_to_scratch: True # Whether to move data to scratch for faster access
  every_x_doy: 1 # Use every x day of year (1 = all, 2 = every second day, etc.)
  use_SWI: True # Whether to use Space Weather Indices as input data
  SH_degree: 0
  min_elevation: 5.0
  max_elevation: 90.0
  shuffle: True
  train_subset_size: 1_000_000  # Large training set for baseline performance
  val_size: 1_000_000  # Number of validation samples to use ('full' for entire val set, or integer for specific count)
  test_size: 10_000_000  # Number of test samples to use ('full' for entire test set, or integer for specific count)

model:
  model_type: MLP  # Deterministic MLP for baseline (no uncertainty)
  hidden_dim: 1024     # Large hidden dimension for good capacity
  num_layers: 6        # Deep network for baseline performance
  
training:
  loss_function: "MSELoss"  # Standard MSE loss for deterministic models
  loss_weight: 1.0          # Weight for the loss function
  
  # Target weighting configuration for addressing underprediction of high values
  target_weighting:
    enabled: false                   # Enable target-based loss weighting
    weight_function: "linear"    # Use linear weighting for baseline
  
  optimizer: "Adam"                # Adam for baseline
  weight_decay: 0.0             # Regularization
  standardize_targets: False        # Disable target standardization to avoid negative loss
  log_target: False              # Disable log-space training
  log_space_point: "mean"        # For compatibility

pretrain:
  epochs: 100                       # Longer training for baseline performance
  batchsize: 1024                   # Good batch size for stability
  num_workers: 12 
  prefetch_factor: 4
  learning_rate: 0.0005              # Conservative learning rate
  scheduler: CosineAnnealingLR       # CosineAnnealingLR for smooth learning rate decay
  scheduler_step_size: 100           # Step size for scheduler (reduces lr every X epochs)
  early_stopping: true               # Whether to use early stopping
  patience: 15                       # More patience for baseline training
  save_model_every_epoch: False      # Whether to save the model every epoch

finetune:
  epochs: 5
  num_workers: 12
  learning_rate: 0.0005
  scheduler: CosineAnnealingLR       # CosineAnnealingLR for fine-tuning
  scheduler_step_size: 10            # Step size for scheduler (reduces lr every X epochs)

# Timing and performance tracking
enable_timing: false              # Enable detailed timing logs
