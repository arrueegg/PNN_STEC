# General configuration
project_name: "PNN_STEC"
output_dir: "experiments/"
year: 2023
doy: 1
mode: pretrain # pretrain, finetune
random_seed: 42
debug: True  
debug_single_batch: False  
cluster: False

enable_timing: False  # Enable detailed performance timing (useful for debugging/optimization)
# Timing configuration - only active when enable_timing=True
timing_config:
  detailed_batch_timing: False  # Time individual batch operations (warning: can slow training)
  save_timing_to_file: True     # Save timing statistics to CSV file in experiment directory
  log_timing_every_n_batches: 100  # Log timing info every N batches during training (0 = disable periodic logs)

target: "stec" # stec or vtec

data:
  GNSS_data_path: "/home/space/data/IONO/STEC_DB_CASDCB"
  use_agg_h5: True
  scratch_dir: "/scratch2/arrueegg/WP4/PNN_STEC/data/"
  SWI_data_path: "/home/space/data/IONO/SWI/"
  move_to_scratch: True # Whether to move data to scratch for faster access
  every_x_doy: 1 # Use every x day of year (1 = all, 2 = every second day, etc.)
  use_SWI: True # Whether to use Space Weather Indices as input data
  SH_degree: 0
  min_elevation: 5.0
  max_elevation: 90.0
  shuffle: True
  train_subset_size: 500_000  # Number of samples to use per epoch

model:
  model_type: MLP_NLL # BNN_NLL, BNN_mse, BranchMLP, Branch_BNN_NLL, MLP_MCDropout_NLL, MLP_MCDropout_mse, MLP_DE, MLP
  hidden_dim: 256     # Number of neurons in hidden layers (default: 256)
  num_layers: 4       # Number of hidden layers (not including output layer) (default: 4)
  
  # Examples for hyperparameter tuning (BNN):
  # Small model:   hidden_dim: 64,  num_layers: 2  (~13K parameters)
  # Medium model:  hidden_dim: 128, num_layers: 3  (~67K parameters) 
  # Large model:   hidden_dim: 512, num_layers: 5  (~1.3M parameters)
  # Deep model:    hidden_dim: 256, num_layers: 8  (~789K parameters)
  
training:
  loss_function: "MSELoss"  # Loss function: MSELoss, MAELoss, GaussianNLLLoss
  loss_weight: 10.0
  
  # Target weighting configuration for addressing underprediction of high values
  target_weighting:
    enabled: true                    # Enable weighted loss based on target values
    weight_function: "linear"      # Options: linear, quadratic, log, quantile
    high_value_threshold: 0.75       # For quantile weighting: percentile threshold (0.75 = 75th percentile)
    high_value_weight: 3.0           # For quantile weighting: weight multiplier for high values
  
  optimizer: "Adam"             # SGD, Adam, AdamW
  weight_decay: 0.0             # Weight decay for regularization
  standardize_targets: False        # Disable target standardization to avoid negative loss
  log_target: False              # Disable log-space training
  log_space_point: "mean"        # For compatibility

pretrain:
  epochs: 200
  batchsize: 512
  num_workers: 12
  prefetch_factor: 4
  learning_rate: 0.01
  scheduler: none            # none, StepLR, CosineAnnealingLR
  scheduler_step_size: 50       # Step size for scheduler (reduces lr every X epochs)
  early_stopping: true          # Whether to use early stopping
  patience: 30                   # Patience for early stopping
  save_model_every_epoch: False # Whether to save the model every epoch

finetune:
  epochs: 5
  num_workers: 4
  learning_rate: 0.001
  scheduler: StepLR            # Scheduler: none, step_lr, cosine_annealing
  scheduler_step_size: 10       # Step size for scheduler (reduces lr every X epochs)


