program: scripts/wandb_run_wrapper.py
method: bayes  # bayes, grid, random
metric:
  goal: minimize
  name: val_MAE
parameters:
  # Model architecture parameters
  model.model_type:
    values: ['BNN_NLL']
  
  model.hidden_dim:
    values: [256, 512, 1024, 2048, 4096, 8192]
  
  model.num_layers:
    values: [4, 8]

  model.prior_sigma:
    values: [0.01, 0.05, 0.1, 0.2]

  # Training hyperparameters
  pretrain.learning_rate:
    values: [0.0001, 0.0005, 0.001, 0.005, 0.01]
  
  pretrain.batchsize:
    values: [1024]
  
  training.loss_weight:
    values: [0.01, 0.1, 1.0, 10.0]

  # Training configuration
  training.loss_function:
    values: ['GaussianNLLLoss']
  
  #training.optimizer:
    #values: ['Adam', 'AdamW']
  
  #training.weight_decay:
    #distribution: uniform
    #min: 0.0
    #max: 0.01

  # KL annealing for BNN models
  #training.kl_annealing.warmup_epochs:
    #values: [5, 10, 20]

  # Target weighting
  training.target_weighting.enabled:
    values: [false]
  
  #training.target_weighting.weight_function:
    #values: ['linear', 'quadratic']

  # Scheduler configuration
  #pretrain.scheduler:
    #values: ['StepLR', 'CosineAnnealingLR']
  
  #pretrain.scheduler_step_size:
    #values: [20, 50, 100]

  # Data configuration
  #data.train_subset_size:
    #values: [500_000]

# Count limits
run_cap: 100  # Maximum number of runs in this sweep